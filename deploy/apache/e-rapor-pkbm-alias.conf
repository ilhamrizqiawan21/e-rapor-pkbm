# Include inside the ilham.didzacorp.com HTTP and HTTPS virtual hosts.
# Expose only Laravel's public directory at /e-rapor-pkbm.

Alias /e-rapor-pkbm /var/www/html/ilham.didzacorp.com/e-rapor-pkbm/public

<Directory /var/www/html/ilham.didzacorp.com/e-rapor-pkbm>
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/ilham.didzacorp.com/e-rapor-pkbm/public>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /e-rapor-pkbm/index.php

    <FilesMatch "^\.env|^\.git|^\.ht">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>
