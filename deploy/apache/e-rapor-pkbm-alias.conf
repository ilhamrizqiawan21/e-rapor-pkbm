# Include this file inside an Apache HTTP and HTTPS virtual host, then adjust
# the application directory and PHP-FPM socket for the server.
# This example exposes the application at /e-rapor-pkbm.

Alias /e-rapor-pkbm /var/www/example/e-rapor-pkbm/public
SetEnv ERAPOR_SUBPATH /e-rapor-pkbm

<Directory /var/www/example/e-rapor-pkbm>
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/example/e-rapor-pkbm/public>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /e-rapor-pkbm/index.php

    <FilesMatch "^\.env|^\.git|^\.ht">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>
